<!doctype html>
<meta charset="utf-8">
<title>AirPlay Test</title>
<style>
  html, body { margin: 0; background: #101014; color: #e8e8ee;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  video { display: block; width: 100%; height: 70vh; background: #000; }
  #hint, #diag { padding: 8px 16px; margin: 0; color: #a9a9b8; }
  #hint b { color: #e8e8ee; }
  #diag { color: #e8b84a; white-space: pre-wrap; }
  button { font: inherit; margin: 4px 16px; }
</style>

<video id="v" controls autoplay playsinline x-webkit-airplay="allow"></video>
<p id="hint">Waiting for the stream…</p>
<p id="diag"></p>
<button id="play">Force play()</button>

<script>
  var got = false, triedLoopback = false, baseURL = null;
  var v = document.getElementById("v");
  var diag = document.getElementById("diag");

  function note(s) { diag.textContent += s + "\n"; }

  function setSrc(url) {
    note("loading: " + url);
    v.src = url + "index.m3u8";
    v.load();
    v.play().then(function(){ note("play() started"); },
                  function(e){ note("play() rejected: " + e.name + " " + e.message); });
  }

  v.addEventListener("error", function () {
    var e = v.error;
    note("media error code=" + (e ? e.code : "?") +
         " (1=aborted 2=network 3=decode 4=src-not-supported)" +
         (e && e.message ? " msg=" + e.message : ""));
    if (!triedLoopback && baseURL) {
      triedLoopback = true;
      var loop = baseURL.replace(/\/\/[^:]+:/, "//127.0.0.1:");
      note("falling back to loopback…");
      setSrc(loop);
    }
  });
  v.addEventListener("playing", function () { note("PLAYING via " + v.currentSrc); });
  v.addEventListener("webkitplaybacktargetavailabilitychanged", function (ev) {
    note("airplay target availability: " + ev.availability);
  });
  document.getElementById("play").onclick = function () { v.play(); };

  iina.onMessage("url", function (d) {
    if (got) return;
    got = true;
    baseURL = d.url;
    document.getElementById("hint").innerHTML =
      "<b>If an AirPlay button appears in the controls above, the whole design works.</b><br>" +
      "Serving from " + d.url;
    setSrc(d.url);
  });

  var tries = 0;
  var timer = setInterval(function () {
    if (got || tries++ > 40) { clearInterval(timer); return; }
    iina.postMessage("ready", {});
  }, 250);
  iina.postMessage("ready", {});
</script>
